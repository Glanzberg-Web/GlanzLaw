<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 980" role="img" aria-labelledby="title desc">
  <title id="title">Jack Glanzberg portrait placeholder</title>
  <desc id="desc">A monogram placeholder to be replaced with a licensed professional headshot of Jack Glanzberg.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1f33"/>
      <stop offset="1" stop-color="#1d3a56"/>
    </linearGradient>
    <pattern id="p" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="44" stroke="#c19a5b" stroke-width="2" opacity=".13"/>
    </pattern>
  </defs>
  <rect width="800" height="980" fill="url(#g)"/>
  <rect width="800" height="980" fill="url(#p)"/>
  <circle cx="400" cy="385" r="145" fill="#f5f0e7" opacity=".08"/>
  <text x="400" y="430" text-anchor="middle" font-family="Georgia,serif" font-size="178" fill="#f5f0e7">JG</text>
  <line x1="220" y1="520" x2="580" y2="520" stroke="#c19a5b" stroke-width="3"/>
  <text x="400" y="585" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" letter-spacing="5" fill="#f5f0e7">PORTRAIT PLACEHOLDER</text>
  <text x="400" y="632" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#d8d4cc">Replace with Jack's licensed headshot</text>
</svg>
